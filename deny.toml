[advisories]
# Review by 2027-01-30: reassess these unmaintained transitive crates and upstream replacements.
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "Unmaintained bincode 1.3.3 is pulled in by syntect 5.3.0 for syntax highlighting; retain pending an upstream replacement." },
  { id = "RUSTSEC-2026-0192", reason = "Unmaintained ttf-parser 0.25.1 is pulled in by owned_ttf_parser via ab_glyph (directly and through epaint/egui); retain pending an upstream font-parser replacement." },
  { id = "RUSTSEC-2026-0371", reason = "Unmaintained zbus_names 4.3.5 is pulled in by zbus and atspi-common through eframe/egui-winit -> accesskit_winit -> accesskit_unix for Linux accessibility; retain pending upstream migration." },
  { id = "RUSTSEC-2026-0370", reason = "Unmaintained zvariant 5.15.1 is pulled in by zbus, zbus_names and AT-SPI crates through eframe/egui-winit -> accesskit_winit -> accesskit_unix for Linux accessibility; retain pending upstream migration." },
  { id = "RUSTSEC-2026-0372", reason = "Unmaintained zvariant_derive 5.15.1 is pulled in by zvariant through eframe/egui-winit -> accesskit_winit -> accesskit_unix for Linux accessibility; retain pending upstream migration." },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "OFL-1.1", "Ubuntu-font-1.0", "LicenseRef-UFL-1.0", "BSL-1.0", "0BSD"]

[bans]
multiple-versions = "warn"
