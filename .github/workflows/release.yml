name: Release
# Builds unsigned installers on version tags. See PACKAGING.md for signing.
on:
  push:
    tags: ['v*']
    branches: ['cross-platform']  # TEMP-TEST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev fontconfig libfuse2
      - run: cargo install cargo-packager cargo-generate-rpm --locked
      - run: cargo build --release --locked
      - run: cargo packager --release --formats deb,appimage,pacman
      - run: cargo generate-rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/*
            target/generate-rpm/*.rpm
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-packager --locked
      - run: cargo build --release --locked
      - run: cargo packager --release --formats wix
      - run: Compress-Archive -Path target/release/caelum-rs.exe,LICENSE -DestinationPath dist/caelum-rs-windows-x86_64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo install cargo-packager --locked
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/caelum-rs \
            target/aarch64-apple-darwin/release/caelum-rs \
            target/x86_64-apple-darwin/release/caelum-rs
      - run: cargo packager --release --formats dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: dist/*
